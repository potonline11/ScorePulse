services:
  - type: web
    name: scorepulse-xg
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: NODE_ENV=production npx tsx server.ts
    healthCheckPath: /api/cron/tick
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ONEXBET_PROMO_CODE
        sync: false
      - key: ONEXBET_PARTNER_LINK
        sync: false
